services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-os_insight}
      POSTGRES_USER: ${POSTGRES_USER:-os_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL runs init scripts only when creating a new data directory.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      # Keep database and application traffic on a project-local bridge.
      - os_insight_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-os_insight}
      POSTGRES_USER: ${POSTGRES_USER:-os_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      SERVICE_NAME: api
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        # Start the API only after PostgreSQL can accept connections.
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # Bound the monitored service so its own resource usage remains controlled.
    cpus: 1.0
    mem_limit: 512m
    networks:
      - os_insight_net

  worker:
    # Build from the repository root so the worker can reuse api/metrics.py.
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-os_insight}
      POSTGRES_USER: ${POSTGRES_USER:-os_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
    depends_on:
      db:
        # The worker queries jobs as soon as it starts, so wait for PostgreSQL.
        condition: service_healthy
    restart: unless-stopped
    # Keep stress tests within the resource budget assigned to the worker.
    cpus: 0.5
    mem_limit: 256m
    networks:
      - os_insight_net

  web:
    build: ./web
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        # The dashboard proxy targets the API container by service name.
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - os_insight_net

volumes:
  postgres_data:

networks:
  os_insight_net:
    driver: bridge
